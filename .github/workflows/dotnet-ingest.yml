name: .NET mass-ingest

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}
  schedule:
    - cron: 0 17 * * 1

concurrency:
  group: dotnet-ingest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ingest:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows builds the full sample, including the classic packages.config /
          # WPF desktop app. No Mono is needed on Windows.
          - os: windows-latest
            repos_csv: test/dotnet-repos-windows.csv
          # Linux builds the cross-platform subset. The WPF/packages.config desktop app
          # cannot build under Mono (WPF is Windows-only), so it is excluded here.
          - os: ubuntu-latest
            repos_csv: test/dotnet-repos-linux.csv
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      REPOS_CSV: ${{ matrix.repos_csv }}
      # Build-only: run the real entrypoint but do not configure a publish target, so no
      # token/secret is needed — the SKIP_PUBLISH conditional in publish.ps1/.sh skips
      # `mod publish` and log upload. To exercise publish, provide PUBLISH_URL + credentials
      # (e.g. GitHub Packages via GITHUB_TOKEN) and set SKIP_PUBLISH: "false".
      SKIP_PUBLISH: "true"
    steps:
      - uses: actions/checkout@v5

      # Moderne's dotnet build step needs .NET SDK 10.0+ on PATH (both OSes).
      - name: Set up .NET SDK 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # Windows ships MSBuild / VS Build Tools and needs no Mono; setup-nuget puts nuget.exe on PATH.
      - name: Set up NuGet CLI (Windows)
        if: runner.os == 'Windows'
        uses: nuget/setup-nuget@v3

      # Linux: restoring .NET Framework (packages.config) needs the NuGet CLI run under Mono.
      # Install Mono, drop nuget.exe on PATH, and add a `nuget` shim that execs it via Mono.
      - name: Set up Mono + NuGet CLI (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-complete
          mono --version
          sudo curl -fsSL -o /usr/local/bin/nuget.exe https://dist.nuget.org/win-x86-commandline/latest/nuget.exe
          printf '#!/bin/sh\nexec mono /usr/local/bin/nuget.exe "$@"\n' | sudo tee /usr/local/bin/nuget > /dev/null
          sudo chmod +x /usr/local/bin/nuget
          nuget help | head -1

      # Each step runs in a fresh shell, so persist the CLI's bin directory via $GITHUB_PATH.
      - name: Install the Moderne CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://app.moderne.io/cli/windows | iex
          mod --version
          Split-Path (Get-Command mod).Source | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install the Moderne CLI (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://app.moderne.io/cli | bash
          echo "$HOME/.moderne/cli/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.moderne/cli/bin:$PATH"
          mod --version

      - name: Report the .NET build toolchain
        shell: pwsh
        run: |
          dotnet --info
          Write-Host "nuget: $((Get-Command nuget -ErrorAction SilentlyContinue).Source)"
          if ($env:RUNNER_OS -ne 'Windows') { mono --version | Select-Object -First 1 }

      # Runs the real end-user entrypoint (publish.ps1 on Windows, publish.sh on Linux) from
      # the checkout root, where this repo's moderne.yml sits. This exercises the actual
      # script — credential config, CSV resolution, batching, build, and (when enabled)
      # publish — not just raw `mod` commands. Build success is asserted from the script's
      # own output; publish.ps1/.sh delete each batch's build dir after building, so there is
      # no post-run LST tree to inspect.
      - name: Run mass-ingest (publish.ps1)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          $env:DATA_DIR = Join-Path $env:RUNNER_TEMP 'moderne'
          .\publish.ps1 -SourceCsv $env:REPOS_CSV *>&1 | Tee-Object -FilePath ingest.log
          $out = Get-Content ingest.log -Raw
          if ($out -notmatch 'Successfully built and uploaded repositories') {
            Write-Error 'publish.ps1 did not report a successful build'; exit 1
          }
          if ($out -match 'Error building and uploading repositories') {
            Write-Error 'publish.ps1 reported a build failure'; exit 1
          }
          Write-Host 'publish.ps1 completed: build succeeded (publish skipped).'

      - name: Run mass-ingest (publish.sh)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export DATA_DIR="$RUNNER_TEMP/moderne"
          set +e
          bash publish.sh "$REPOS_CSV" 2>&1 | tee ingest.log
          set -e
          grep -q "Successfully built and uploaded repositories" ingest.log \
            || { echo "publish.sh did not report a successful build"; exit 1; }
          if grep -q "Error building and uploading repositories" ingest.log; then
            echo "publish.sh reported a build failure"; exit 1
          fi
          echo "publish.sh completed: build succeeded (publish skipped)."

      - name: Upload ingest log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-ingest-log-${{ matrix.os }}
          path: ingest.log
          if-no-files-found: warn
          retention-days: 7

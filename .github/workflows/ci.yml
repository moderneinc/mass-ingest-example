name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}
  schedule:
    - cron: 0 17 * * 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Validate the Kubernetes manifests
      run: |
        curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
        export RUN_NAME=ci IMAGE=mass-ingest:ci SHARDS=8 CONCURRENCY=2 CLUSTER_NAME=ci NODE_ROLE=ci
        for f in k8s/*.yaml k8s/eks/*.yaml; do envsubst < "$f"; echo ---; done |
          ./kubeconform -strict -summary -ignore-missing-schemas

  image:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - name: Build
      uses: docker/build-push-action@v6
      with:
        context: .
        tags: mass-ingest:ci
        load: true
        cache-from: type=gha,scope=mass-ingest
        cache-to: type=gha,scope=mass-ingest,mode=max
    - name: mod doctor in a bare container
      run: |
        docker run --rm mass-ingest:ci mod doctor /var/moderne --skip-remote --json > doctor.json
        python3 -m json.tool doctor.json

services:
  mass-ingest:
    build:
      context: ..
      # Valueless entries are taken from the environment Compose runs in, and left unset
      # when absent — so the Dockerfile's own defaults (the Code Genome Project) apply.
      args:
        MODERNE_CLI_VERSION:
        MODERNE_CLI_RELEASES_REPO:
        MODERNE_CLI_SNAPSHOTS_REPO:
      # The Moderne CLI is pulled from the Code Genome Project during the build, which needs
      # the Moderne-supplied username and download token. Export CGP_USERNAME and CGP_PASSWORD
      # before `docker compose build`, or swap the `environment:` sources at the bottom of this
      # file for `file: ./cgp_username` / `file: ./cgp_password`.
      secrets:
        - cgp_username
        - cgp_password
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - data:/var/moderne
      - ../repos.csv:/app/repos.csv
      # Uncomment to mount git credentials for private repositories
      # - ./.git-credentials:/home/moderne/.git-credentials:ro
      # Or mount SSH keys instead:
      # - ./.ssh:/home/moderne/.ssh:ro
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    # Uncomment to access Prometheus UI directly (optional - Grafana is the primary interface)
    # ports:
    #   - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - monitoring
    depends_on:
      - prometheus

networks:
  monitoring:
    driver: bridge

volumes:
  data:

secrets:
  cgp_username:
    environment: CGP_USERNAME
  cgp_password:
    environment: CGP_PASSWORD
